name: metaautomate-private

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metaautomate
      POSTGRES_USER: metaautomate_admin
      POSTGRES_PASSWORD: \${POSTGRES_ADMIN_PASSWORD:?Set a strong PostgreSQL administrator password}
    volumes:
      - metaautomate_private_postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaautomate_admin -d metaautomate"]
      interval: 5s
      timeout: 5s
      retries: 15
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    image: metaautomate/workspace:private-v1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgresql://metaautomate_runtime:\${APP_DB_PASSWORD:?Required}@postgres:5432/metaautomate
      WORKSPACE_AUTH_MODE: oidc
      WORKSPACE_ORIGIN: \${WORKSPACE_ORIGIN:?Must be the private HTTPS Tailscale address}
      WORKSPACE_COOKIE_SECURE: "1"
      OIDC_ISSUER: \${OIDC_ISSUER:?Required}
      OIDC_CLIENT_ID: \${OIDC_CLIENT_ID:?Required}
      OIDC_CLIENT_SECRET: \${OIDC_CLIENT_SECRET:?Required}
      OIDC_REDIRECT_URI: \${OIDC_REDIRECT_URI:?Required}
      OIDC_STATE_SECRET: \${OIDC_STATE_SECRET:?Required}
      WORKSPACE_WEB_ROOT: /srv/metaautomate/web
    ports: ["127.0.0.1:8080:8000"]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "10001:10001"
    pids_limit: 256
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrator:
    profiles: ["admin"]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: metaautomate_admin
      PGDATABASE: metaautomate
      PGPASSWORD: \${POSTGRES_ADMIN_PASSWORD:?Required}
      APP_DB_PASSWORD: \${APP_DB_PASSWORD:?Required}
    volumes:
      - ../../database/migrations:/migrations:ro
      - ./scripts/migrate_fresh.sh:/opt/migrate_fresh.sh:ro
    entrypoint: ["/bin/sh", "/opt/migrate_fresh.sh"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  admin:
    profiles: ["admin"]
    image: metaautomate/workspace:private-v1
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://metaautomate_admin:\${POSTGRES_ADMIN_PASSWORD:?Required}@postgres:5432/metaautomate
      OIDC_ISSUER: \${OIDC_ISSUER:?Required}
    volumes:
      - ../../scripts:/opt/meta-scripts:ro
    entrypoint: ["python"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:

volumes:
  metaautomate_private_postgres:

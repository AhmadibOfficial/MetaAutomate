name: MetaAutomate Global Company Experience

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/site/**"
      - "scripts/verify_brand_site_v2.py"
      - "scripts/verify_unified_workspace_browser.py"
      - "render.yaml"
      - ".github/workflows/brand-site.yml"
  push:
    branches: [feat/global-company-experience-v2, main]
    paths:
      - "apps/site/**"
      - "scripts/verify_brand_site_v2.py"
      - "render.yaml"
      - ".github/workflows/brand-site.yml"

permissions:
  contents: read

jobs:
  business-experience:
    name: Global Website — Desktop, Mobile, Privacy and Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate multi-page static assets and free hosting isolation
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path
          root = Path("apps/site")
          pages = ["index.html","services/index.html","company/index.html","engage/index.html"]
          assets = ["assets/site.css","assets/site.js","assets/metaautomate-mark.webp"]
          for rel in pages+assets:
              path = root / rel
              assert path.is_file() and path.stat().st_size > 0, f"Missing: {rel}"
          config = yaml.safe_load(Path("render.yaml").read_text(encoding="utf-8"))
          assert len(config["services"])==1
          site=config["services"][0]
          assert site["runtime"]=="static"
          assert site["staticPublishPath"]=="./apps/site"
          assert site["autoDeployTrigger"]=="off"
          assert "envVars" not in site
          assert "disk" not in site
          assert "startCommand" not in site
          home=(root/"index.html").read_text(encoding="utf-8")
          assert "Real business challenges." in home
          assert "Clear next steps." in home
          assert 'id="solutions"' in home
          assert 'id="workspace-demo"' in home
          assert home.index('id="solutions"') < home.index('id="services"') < home.index('id="workspace-demo"')
          assert 'class="section proof-section"' not in home
          assert "OUR APPROACH" in home
          assert "Prepare an actionable plan" in home
          assert "browser-local development preview" in home
          assert "MetaAutomate" in home
          assert "Always HALAL" in (root/"company/index.html").read_text(encoding="utf-8")
          for page in pages:
              html=(root/page).read_text(encoding="utf-8")
              assert "<main id=\"main\">" in html, page
              assert "metaautomate-mark.webp" in html, page
              if page == "engage/index.html":
                  assert 'href="/creative/' in html, page
                  assert 'href="/"' in html, page
              else:
                  assert 'href="/engage/' in html, page
              for secret in (".workspace-access-key","DATABASE_URL","REGISTRY_READ_API_KEY","OIDC_CLIENT_SECRET","PRIVATE KEY"):
                  assert secret not in html, (page,secret)
          for path in root.rglob("*"):
              assert path.is_file() or path.is_dir()
              assert not path.name.startswith(".env"),path
          print("PASS: four accessible static pages; no secrets, API or database deployment")
          for rel in ["workspace/index.html","assets/focused-home.css","assets/campaign-engine.js","assets/unified-workspace.css","assets/unified-workspace.js"]:
              path = root / rel
              assert path.is_file() and path.stat().st_size > 0, f"Missing new workspace asset: {rel}"
          PY
          node --check apps/site/assets/site.js
          node --check apps/site/assets/campaign-engine.js
          node --check apps/site/assets/unified-workspace.js
      - name: Install Chromium for real website verification
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Test global homepage, services, company, project brief and responsive layouts
        run: |
          python -m http.server 18080 --bind 127.0.0.1 --directory apps/site >/tmp/meta-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/meta-site-http.log
            exit 1
          fi
          python scripts/verify_brand_site_v2.py
          python scripts/verify_unified_workspace_browser.py
      - name: Upload reviewed global brand desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaautomate-global-company-experience
          path: |
            artifacts/metaautomate-global-*.png
            artifacts/metaautomate-accessibility-tree-report.json
          if-no-files-found: warn

name: MetaAutomate Business Website

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/site/**"
      - "scripts/verify_brand_site.py"
      - "render.yaml"
      - ".github/workflows/brand-site.yml"
  push:
    branches: [feat/branded-business-website-v1, main]
    paths:
      - "apps/site/**"
      - "scripts/verify_brand_site.py"
      - "render.yaml"
      - ".github/workflows/brand-site.yml"

permissions:
  contents: read

jobs:
  site-preview:
    name: Desktop, Mobile and Static Hosting Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify static assets and deploy-only topology
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path
          root=Path("apps/site")
          required=("index.html","assets/site.css","assets/site.js","assets/metaautomate-mark.webp")
          for item in required:
              path=root/item
              assert path.is_file() and path.stat().st_size>0,item
          spec=yaml.safe_load(Path("render.yaml").read_text(encoding="utf-8"))
          assert len(spec["services"])==1
          site=spec["services"][0]
          assert site["runtime"]=="static"
          assert site["staticPublishPath"]=="./apps/site"
          assert site["autoDeployTrigger"]=="off"
          assert not any(x in site for x in ("envVars","startCommand","disk"))
          html=Path("apps/site/index.html").read_text(encoding="utf-8")
          assert "Turn your vision" in html
          assert "Always HALAL" in html
          assert "Long-term vision" in html or "LONG-TERM VISION" in html
          for dangerous in (".workspace-access-key","DATABASE_URL","SECRET_KEY","REGISTRY_READ_API_KEY"):
              assert dangerous not in html,dangerous
          print("PASS: pure static assets, no secrets or live backend in free deployment")
          PY
          node --check apps/site/assets/site.js
      - name: Install Chromium for realistic browser verification
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Validate desktop, mobile, accessibility and feature filters
        run: |
          python -m http.server 18080 --bind 127.0.0.1 --directory apps/site >/tmp/meta-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/meta-site-http.log
            exit 1
          fi
          python scripts/verify_brand_site.py
      - name: Upload reviewed desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaautomate-business-site-preview
          path: artifacts/metaautomate-business-*.png
          if-no-files-found: warn

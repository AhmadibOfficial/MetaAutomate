name: P2-04x Private Project AI Gateway Source Checks

on:
  push:
    branches: [feature/p2-04x-private-ai-conversation-gateway]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  private-gateway-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKSPACE_AUTH_MODE: dev_key
      MAT_PRIVATE_PROJECT_CHAT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing backend unit test dependencies
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2,<3' 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - name: Check Python source and gateway request policy
        run: |
          python -m compileall -q apps/api/app/project_chat_private.py apps/api/app/main.py
          PYTHONPATH=apps/api python -m pytest -q tests/test_p2_04x_private_chat.py
      - name: Verify disabled default and no direct media actions
        run: |
          python - <<'PY'
          from pathlib import Path
          content=Path('apps/api/app/project_chat_private.py').read_text()
          app=Path('apps/api/app/main.py').read_text()
          assert 'get_tenant_session' in content
          assert 'approved_local_model_config()' in content
          assert '127.0.0.1' in content
          assert '"media_generation_authorized":False' in content
          assert 'if os.environ.get("MAT_PRIVATE_PROJECT_CHAT_ENABLED") == "1":' in app
          print('Source checks only, not an approval to activate real model inference')
          PY

name: P2-04w Chat-first Start a Project

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/p2-04w-chat-first-start-project]

permissions:
  contents: read

jobs:
  project-intake-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run page source and existing enquiry compatibility tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q \
            tests/test_p2_04w_project_chat_static.py \
            tests/test_site_customer_clarity.py
      - name: Validate browser-only script syntax
        run: node --check apps/site/assets/project-chat.js
      - name: Validate HTML markup with standard parser
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          parser=HTMLParser()
          parser.feed(Path('apps/site/engage/index.html').read_text())
          print('Project chat HTML parsed')
          PY

  project-intake-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    needs: project-intake-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local browser-only test requirements
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Run real keyboard, mobile and XSS-safe intake acceptance
        run: |
          python -m http.server 18080 --bind 127.0.0.1 --directory apps/site >/tmp/mat-project-chat-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/engage/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python scripts/verify_project_chat_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metaautomate-start-project-chat-desktop-mobile
          path: artifacts/validation/start-project-chat-*.png
          if-no-files-found: warn

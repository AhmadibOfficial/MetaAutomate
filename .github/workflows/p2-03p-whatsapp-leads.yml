name: MetaAutomate WhatsApp Lead Policy Lab (source-only)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/p2-03p-whatsapp-consent-led-growth

permissions:
  contents: read

jobs:
  consent-first-leads:
    name: Policy gates, source parity, responsive browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=8,<10' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Verify WhatsApp source-only consent and privacy policy gates
        run: |
          python -m pytest -q tests/test_synthetic_whatsapp_lead_pipeline.py
      - name: Verify source-generated WhatsApp preview data
        run: python scripts/build_whatsapp_lead_contract.py --check
      - name: Verify no malformed browser scripts
        run: |
          node --check apps/site/intelligence-lab/whatsapp/data.js
          node --check apps/site/intelligence-lab/whatsapp/whatsapp.js
          node --check apps/site/intelligence-lab/lab.js
      - name: Verify four-stage browser, opt-outs, and mobile navigation
        run: python scripts/verify_whatsapp_leads_browser.py
      - name: Upload review-only visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-03p-whatsapp-compliance-demo-visuals
          path: |
            artifacts/validation/whatsapp-leads-desktop.png
            artifacts/validation/whatsapp-leads-mobile-390.png
            artifacts/validation/whatsapp-leads-mobile-360.png
          if-no-files-found: warn

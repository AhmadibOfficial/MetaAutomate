name: MetaAutomate Secure Meta Lead Foundation (source-only)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/p2-03r-secure-meta-lead-foundation

permissions:
  contents: read

jobs:
  meta-lead-security:
    name: Signed webhooks · tenant CRM · Facebook browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install offline test tools
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=8,<10' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Test signed Facebook, Instagram and WhatsApp normalization
        run: |
          python -m pytest -q tests/test_meta_webhook_signature.py tests/test_synthetic_meta_lead_federation.py
          python -m pytest -q tests/test_synthetic_instagram_lead_pipeline.py tests/test_synthetic_whatsapp_lead_pipeline.py
      - name: Check Facebook UI provenance from signed demo events
        run: python scripts/build_meta_facebook_lead_contract.py --check
      - name: Validate JavaScript
        run: |
          node --check apps/site/intelligence-lab/facebook/data.js
          node --check apps/site/intelligence-lab/facebook/facebook.js
          node --check apps/site/intelligence-lab/lab.js
      - name: Exercise Facebook leadgen desktop/mobile source-only preview
        run: python scripts/verify_facebook_leads_browser.py
      - name: Upload source-only desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-03r-facebook-lead-security-review
          path: |
            artifacts/validation/facebook-lead-desktop.png
            artifacts/validation/facebook-lead-mobile-390.png
            artifacts/validation/facebook-lead-mobile-360.png
          if-no-files-found: warn

name: MetaAutomate CI

on:
  pull_request:
    branches:
      - main
      - feat/vscode-workspace-v1
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python and PostgreSQL Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metaautomate
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: metaautomate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metaautomate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://metaautomate:ci_only_password@localhost:5432/metaautomate
      PGPASSWORD: ci_only_password
      PYTHONPATH: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt 'PyYAML>=6,<7'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Validate unified engineering capability registry (source only)
        run: |
          python scripts/verify_engineering_capability_registry.py \
            --report artifacts/validation/engineering-capability-registry.json

      - name: Upload engineering capability registry validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-capability-registry-evidence
          path: artifacts/validation/engineering-capability-registry.json
          if-no-files-found: warn

      - name: Validate capability lifecycle and evidence-upgrade ledger (source only)
        run: |
          python scripts/verify_capability_lifecycle.py \
            --report artifacts/validation/capability-lifecycle.json
          python scripts/verify_capability_lifecycle.py \
            --proposal docs/registry/examples/lifecycle-proposal.example.json \
            --report artifacts/validation/capability-proposal-review.json

      - name: Upload capability lifecycle source review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-lifecycle-source-evidence
          path: |
            artifacts/validation/capability-lifecycle.json
            artifacts/validation/capability-proposal-review.json
          if-no-files-found: warn

      - name: Replay proposed CAP-BUSINESS lifecycle acceptance (source only)
        run: |
          python scripts/verify_capability_lifecycle.py \
            --report artifacts/validation/p2-03g-transportation-lifecycle-replay.json
          python scripts/verify_lifecycle_owner_review.py \
            --report artifacts/validation/p2-03g-owner-review-pending.json

      - name: Refuse pending lifecycle approval metadata on main
        if: github.event_name == 'push'
        run: |
          python scripts/verify_lifecycle_owner_review.py --require-owner-review

      - name: Upload transportation source lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transportation-source-lifecycle-evidence
          path: |
            artifacts/validation/p2-03g-transportation-lifecycle-replay.json
            artifacts/validation/p2-03g-owner-review-pending.json
          if-no-files-found: warn

      - name: Run Python tests
        run: |
          python -m pytest -q \
            -p no:cacheprovider \
            --import-mode=importlib \
            apps/api/tests tests/

      - name: Verify retail and wholesale cross-functional synthetic proposals (no execution)
        run: |
          python scripts/verify_cross_functional_synthetic.py \
            --report artifacts/validation/retail-wholesale-cross-functional-demo.json

      - name: Upload retail and wholesale synthetic demo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-wholesale-synthetic-demo
          path: artifacts/validation/retail-wholesale-cross-functional-demo.json
          if-no-files-found: warn

      - name: Validate cross-sector workflow contract v1 (source/design only)
        run: |
          python scripts/verify_cross_sector_workflow_contract.py \
            --report artifacts/validation/cross-sector-workflow-contract-v1.json

      - name: Upload cross-sector contract source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-sector-contract-source-evidence
          path: artifacts/validation/cross-sector-workflow-contract-v1.json
          if-no-files-found: warn

      - name: Verify synthetic transportation preview (source only)
        run: |
          python scripts/verify_synthetic_transportation.py \
            --report artifacts/validation/transportation-synthetic-demo.json

      - name: Upload transportation synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transportation-synthetic-source-evidence
          path: artifacts/validation/transportation-synthetic-demo.json
          if-no-files-found: warn

      - name: Validate private staging source-only boundaries
        run: |
          python scripts/verify_private_staging_contract.py \
            --report artifacts/validation/private-staging-source.json

      - name: Upload private staging source gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-staging-source-gate
          path: artifacts/validation/private-staging-source.json
          if-no-files-found: warn

      - name: Publish Foundation release no-go evidence
        run: |
          python scripts/verify_foundation_readiness.py \
            --report artifacts/validation/foundation-readiness.json

      - name: Upload Foundation readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-readiness-evidence
          path: artifacts/validation/foundation-readiness.json
          if-no-files-found: warn

      - name: Apply PostgreSQL migrations
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -f "$migration"
          done

      - name: Seed Capability Registry
        run: python scripts/seed_registry.py

      - name: Validate Registry SQL security
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f tests/sql/registry_integration.sql

      - name: Configure restricted objective runtime role
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "ALTER ROLE metaautomate_runtime LOGIN PASSWORD 'ci_runtime_password'"

      - name: Exercise authenticated Objective Operations lifecycle
        env:
          APP_DATABASE_URL: postgresql://metaautomate_runtime:ci_runtime_password@localhost:5432/metaautomate
        run: |
          python scripts/verify_objective_ops.py --database metaautomate

      - name: Verify Operational Core assessment execution, authorization and evidence
        env:
          APP_DATABASE_URL: postgresql://metaautomate_runtime:ci_runtime_password@localhost:5432/metaautomate
        run: |
          python scripts/verify_operational_assessments.py --database metaautomate

      - name: Verify optional private OIDC identity sessions on disposable CI data
        env:
          APP_DATABASE_URL: postgresql://metaautomate_runtime:ci_runtime_password@localhost:5432/metaautomate
        run: python scripts/verify_oidc_identity.py

      - name: Exercise authenticated AMBOY M1 dry-run tenant and quota gate
        env:
          APP_DATABASE_URL: postgresql://metaautomate_runtime:ci_runtime_password@localhost:5432/metaautomate
        run: python scripts/verify_amboy_m1_ci.py

      - name: Verify dedicated OneCall identity replay and audit boundary on disposable CI
        env:
          APP_DATABASE_URL: postgresql://metaautomate_runtime:ci_runtime_password@localhost:5432/metaautomate
        run: python scripts/verify_onecall_p2_02b_ci.py

      - name: Verify OneCall M2M proof and identity atomic pair replay on disposable CI
        env:
          APP_DATABASE_URL: postgresql://metaautomate_runtime:ci_runtime_password@localhost:5432/metaautomate
        run: python scripts/verify_onecall_p2_02c_ci.py

      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium

      - name: Exercise complete browser Objective Workspace workflow
        env:
          APP_DATABASE_URL: postgresql://metaautomate_runtime:ci_runtime_password@localhost:5432/metaautomate
          WORKSPACE_ORIGIN: http://127.0.0.1:8089
          WORKSPACE_COOKIE_SECURE: "0"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8089 > /tmp/meta-workspace-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8089/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/meta-workspace-ci.log
            exit 1
          fi
          python scripts/verify_workspace_browser.py

      - name: Upload Objective Workspace and Operational Core browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objective-workspace-browser
          path: |
            artifacts/objective-workspace.png
            artifacts/operational-core-assessment-report.png
            artifacts/operational-core-assessment-mobile.png
          if-no-files-found: ignore

      - name: Verify automated local workspace bootstrap and CSRF boundary
        env:
          WORKSPACE_ORIGIN: http://127.0.0.1:8000
        run: |
          python scripts/bootstrap_workspace.py
          python scripts/verify_workspace_bootstrap.py
          rm -f .env .workspace-access-key

  recovery-rehearsal:
    name: Disposable PostgreSQL Backup, Restore and Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse verified backup and migration on disposable Docker PostgreSQL
        run: bash scripts/verify_db_upgrade_recovery_ci.sh

  release-evidence-gate:
    name: Release Evidence Gate
    needs: [test, recovery-rehearsal]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install policy parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Evaluate consolidated release evidence
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RECOVERY_RESULT: ${{ needs['recovery-rehearsal'].result }}
        run: |
          python scripts/verify_release_gate.py \
            --test-result "$TEST_RESULT" \
            --recovery-result "$RECOVERY_RESULT"
      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-gate
          path: artifacts/validation/release-gate.json
          if-no-files-found: warn

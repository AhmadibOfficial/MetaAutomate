name: MetaAutomate CI

on:
  pull_request:
    branches:
      - main
      - feat/vscode-workspace-v1
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python and PostgreSQL Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metaautomate
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: metaautomate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metaautomate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://metaautomate:ci_only_password@localhost:5432/metaautomate
      PGPASSWORD: ci_only_password
      PYTHONPATH: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run Python tests
        run: |
          python -m pytest -q \
            -p no:cacheprovider \
            --import-mode=importlib \
            apps/api/tests tests/

      - name: Apply PostgreSQL migrations
        run: |
          for migration in database/migrations/00[1-8]_*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -f "$migration"
          done

      - name: Seed Capability Registry
        run: python scripts/seed_registry.py

      - name: Validate Registry SQL security
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f tests/sql/registry_integration.sql

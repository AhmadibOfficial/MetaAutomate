name: P2-052 Real Private Task Engine (source-only)

on:
  push:
    branches: [feature/p2-052-tenant-task-execution]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  private-execution-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKSPACE_AUTH_MODE: dev_key
      MAT_PRIVATE_TASKS_ENABLED: "0"
      MAT_LOCAL_MODEL_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded source tests only
        run: |
          python -m pip install \
            'fastapi>=0.115,<1' 'httpx>=0.27,<1' \
            'pydantic>=2,<3' 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - name: Compile and execute actual deterministic task handlers
        run: |
          python -m compileall -q \
            apps/api/app/private_task_execution.py \
            apps/api/app/private_model_worker.py \
            apps/api/app/main.py \
            scripts/purge_expired_private_tasks.py
          PYTHONPATH=apps/api python -m pytest -q \
            tests/test_p2_052_private_execution.py \
            tests/test_p2_052_local_model_worker.py
      - name: Ensure off-by-default and actor-scoped SQL source
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path("apps/api/app/main.py").read_text()
          sql=Path("database/migrations/017_private_execution_results.sql").read_text()
          engine=Path("apps/api/app/private_task_execution.py").read_text()
          assert 'if os.environ.get("MAT_PRIVATE_TASKS_ENABLED") == "1":' in app
          assert '"MAT_TASK_STORAGE_APPROVED"' in app
          assert "FORCE ROW LEVEL SECURITY" in sql
          assert "actor_user_id=app.current_user_id()" in sql
          assert "GRANT SELECT, INSERT" in sql
          assert "SELECT pg_advisory_xact_lock" in engine
          assert "executed_on_backend" in engine
          print("Real task source checks only; no customer environment activated.")
          PY

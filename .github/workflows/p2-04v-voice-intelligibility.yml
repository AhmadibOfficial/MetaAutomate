name: MetaAutomate P2-04v Voice Intelligibility Gate

on:
  push:
    branches:
      - feature/p2-04v-voice-intelligibility-gate
  pull_request:
    branches:
      - feature/p2-04u-unified-verified-media-provenance

permissions:
  contents: read

jobs:
  audio-quality-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: apps/api
      MAT_CREATIVE_MULTIMODAL_OFFLINE_ENABLED: "0"
      MAT_CREATIVE_NETWORK_ISOLATED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded source regression runner
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<48' 'Pillow>=10,<13'
      - name: Run speech intelligibility and multimodal security source tests
        run: |
          python -m pytest -q \
            tests/test_p2_04v_voice_quality.py \
            tests/test_p2_04v_voice_operator.py \
            tests/test_p2_04u_multimodal_operator.py \
            tests/test_p2_04u_multimodal_provenance.py
      - name: Verify human-review hold and no neural speech claims
        run: |
          python - <<'PY'
          from pathlib import Path
          qa=Path("apps/api/app/creative_voice_quality.py").read_text()
          op=Path("apps/api/app/creative_multimodal_operator.py").read_text()
          assert 'HOLD_INDEPENDENT_SIGNED_LISTENING_REVIEW' in qa
          assert '"natural_neural_voice_proven":False' in qa
          assert "--recognized-transcript" in op
          assert 'require_technically_ready_narration' in op
          print("Voice acoustic preflight added; signed human review still required.")
          PY

name: QDB START Source Evidence

on:
  pull_request:
    paths:
      - "scripts/qdb_start_readiness.py"
      - "tests/test_qdb_start_readiness.py"
      - "docs/qdb/**"
      - ".github/workflows/qdb-start-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdb-source-evidence:
    name: Offline QDB proof integrity and anti-fabrication tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Compile source without imports or output files
        run: python -c "from pathlib import Path; p=Path('scripts/qdb_start_readiness.py'); compile(p.read_bytes(),str(p),'exec')"
      - name: Run offline fixture tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: "-p no:cacheprovider"
          MAT_DATA_LAB_ENABLED: "0"
          MAT_PILOT_OUTCOMES_ENABLED: "0"
        run: python -m pytest -q tests/test_qdb_start_readiness.py
      - name: Assert no external application or production enablement
        run: |
          python -c "import os; assert os.getenv('MAT_DATA_LAB_ENABLED') != '1'"
          echo "QDB application not submitted. No funding claims or deployment approvals."

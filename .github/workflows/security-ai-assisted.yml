name: MetaAutomate AI-Assisted Engineering Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-detection:
    name: Gitleaks secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history with no persisted credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 pinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  confidentiality-and-sast:
    name: Credential paths and changed-source SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reviewed security analyzer
        run: python -m pip install 'bandit==1.9.4'
      - name: Reject tracked sensitive paths
        run: python3 scripts/security/guard.py --tracked
      - name: Check repository security policy
        run: python3 -m unittest tests.test_ai_assisted_security_controls
      - name: Static analysis of changed Python and application JavaScript
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/security/check_changed_source.py --base "$BASE_SHA" --head "$HEAD_SHA"
